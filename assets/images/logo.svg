<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <!-- Monogram Shield / Vault -->
  <g id="logo-mark">
    <!-- Outer Shield Bevel -->
    <polygon points="12,6 48,6 58,24 48,58 24,58 12,24" fill="#191919" stroke="#FFD400" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Diagonal Bolt Core -->
    <polygon points="28,12 42,12 34,30 44,30 24,52 30,34 20,34" fill="#FFD400"/>
  </g>
  
  <!-- Wordmark -->
  <text x="70" y="41" font-family="'Syne', 'Barlow Condensed', 'Oswald', sans-serif" font-weight="900" font-size="32" letter-spacing="2" fill="#F5F5F0">IRON<tspan fill="#FFD400">VAULT</tspan></text>
  <text x="72" y="56" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="3.5" fill="#858585">SPORTS NUTRITION &#8226; EST. 2026</text>
</svg>
